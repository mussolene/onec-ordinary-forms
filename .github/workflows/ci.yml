name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-test:
    name: Product C++ tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install product dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libxml2-dev zlib1g-dev

      - name: Run product tests
        run: make test

      - name: Run product smoke
        run: make smoke
