name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-test:
    name: Native C++ tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake zlib1g-dev libxml2-dev

      - name: Run native tests
        run: make test

      - name: Run native smoke
        run: make smoke
