name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build product release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install product dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libxml2-dev

      - name: Build and test product
        run: make test

      - name: Run release gate
        run: make release-gate

      - name: Package product binary and schemas
        run: |
          mkdir -p dist
          cp build/sidecars/onec-form-native/oof dist/oof-linux-x86_64
          tar -czf dist/onec-ordinary-forms-linux-x86_64.tar.gz -C dist oof-linux-x86_64 -C .. schemas README.md LICENSE

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
